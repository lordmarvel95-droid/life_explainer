name: بناء تطبيق أندرويد APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: إنشاء وتجهيز ملفات التطبيق
        run: |
          flutter create --org com.lifeexplainer my_app
          cp -r my_app/android .
          cp -r my_app/lib .
          cp my_app/pubspec.yaml .
          flutter pub get

      - name: بناء ملف APK
        run: flutter build apk --release

      - name: رفع ملف APK الجاهز
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
